<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Darshan Kansara - Making complex systems feel simple.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#06070b"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>
    <radialGradient id="azureGlow" cx="20%" cy="0%" r="60%">
      <stop offset="0%"  stop-color="#5aa9ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5aa9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="100%" cy="100%" r="55%">
      <stop offset="0%"  stop-color="#c7a96b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c7a96b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="telemetry" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%"   stop-color="#5aa9ff" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#5aa9ff" stop-opacity="0.7"/>
      <stop offset="75%"  stop-color="#c7a96b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c7a96b" stop-opacity="0"/>
    </linearGradient>
    <style>
      .display { font-family: 'Inter Tight', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif; }
      .mono    { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <!-- Base + glow layers -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#azureGlow)"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>

  <!-- Faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5">
    <path d="M0,158 H1200 M0,316 H1200 M0,474 H1200"/>
    <path d="M200,0 V630 M400,0 V630 M600,0 V630 M800,0 V630 M1000,0 V630"/>
  </g>

  <!-- Top/bottom hairlines -->
  <line x1="80" y1="80"  x2="1120" y2="80"  stroke="#ffffff" stroke-opacity="0.10"/>
  <line x1="80" y1="550" x2="1120" y2="550" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- Eyebrow (top-left) -->
  <g transform="translate(80,108)">
    <circle cx="6" cy="6" r="6" fill="#5aa9ff" opacity="0.9"/>
    <text x="22" y="11" class="mono" font-size="18" letter-spacing="3" fill="#8a8d99">MICROSOFT &#183; REDMOND, WA</text>
  </g>

  <!-- Brand wordmark (top-right) -->
  <g transform="translate(1120,108)" text-anchor="end">
    <text class="mono" font-size="16" letter-spacing="4" fill="#c7a96b">DARSHANKANSARA.COM</text>
  </g>

  <!-- Name lockup -->
  <g transform="translate(80,230)">
    <text class="display" font-size="64" font-weight="400" fill="#c9d0dc" letter-spacing="-1.5">Darshan Kansara</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80,330)">
    <text class="display" font-size="78" font-weight="600" fill="#ffffff" letter-spacing="-2.5">Making complex systems</text>
    <text class="display" font-size="78" font-weight="600" fill="#ffffff" letter-spacing="-2.5" y="92">feel simple.</text>
  </g>

  <!-- Sub line -->
  <g transform="translate(80,500)">
    <text class="display" font-size="22" font-weight="500" fill="#c9d0dc" letter-spacing="-0.2">
      Cloud infrastructure &#183; Reliability &#183; AI-driven operations
    </text>
  </g>

  <!-- Telemetry baseline -->
  <g transform="translate(0,585)">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#ffffff" stroke-opacity="0.05"/>
    <path d="M40,-8 L160,-12 L260,-10 L360,-18 L440,-14 L540,-22 L600,-26 L640,-46 L680,-22 L760,-18 L860,-22 L960,-16 L1080,-20 L1160,-14"
          fill="none" stroke="url(#telemetry)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Footer credentials -->
  <g transform="translate(80,575)">
    <text class="mono" font-size="14" letter-spacing="2" fill="#5b5e6c">25Y EXPERIENCE  /  15Y MICROSOFT  /  AZURE PLATFORMS</text>
  </g>
</svg>
